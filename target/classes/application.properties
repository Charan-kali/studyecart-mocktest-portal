spring.application.name=studyecart-mocktest-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/studyecartmocktestDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
